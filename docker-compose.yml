services:
  barbearia-saas:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: barbearia-saas
    restart: unless-stopped
    environment:
      - PORT=8080
      - STATIC_DIR=/srv/app/public
      - DATA_DIR=/srv/app/data
      - TZ=America/Sao_Paulo
    ports:
      # OBRIGATÓRIO: Sempre prefixar com 127.0.0.1 para não furar o Firewall UFW!
      - "127.0.0.1:8081:8080"
    volumes:
      - barbearia_data:/srv/app/data
    networks:
      - webproxy
    deploy:
      resources:
        limits:
          memory: 256M
    security_opt:
      - no-new-privileges:true

volumes:
  barbearia_data:

networks:
  webproxy:
    external: true
